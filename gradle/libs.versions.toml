[versions]
publish = "0.3.0-SNAPSHOT"
kotlin = "2.2.0"
junitJupiter = "6.1.3"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "14.2.0" }
publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }

[libraries]
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "1.7.3" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junitJupiter" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
jetbrains-annotation = { group = "org.jetbrains", name = "annotations", version = "26.1.0" }

# only for example
diagram-core = { group = "com.seo4d696b75.diagram", name = "core", version.ref = "publish" }
diagram-station = { group = "com.seo4d696b75.diagram", name = "station", version.ref = "publish" }